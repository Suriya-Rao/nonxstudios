# ---------------------------------------------------------------------------
# NONXSTUDIOS — keep /admin off the public tunnel
#
# Installed by docker/entrypoint.sh as /etc/apache2/nonx-admin-guard.conf
# unless ADMIN_ALLOW_REMOTE=true is set.
#
# Requests proxied through a Cloudflare Tunnel always carry CF-Connecting-IP.
# Those come from the internet, so /admin is denied for them. Requests without
# the header come from the host (localhost / the Docker network) and keep full
# access for administration.
# ---------------------------------------------------------------------------
SetEnvIf CF-Connecting-IP "^.+" NONX_FROM_TUNNEL=1

<LocationMatch "^/admin(/|$)">
    <If "%{ENV:NONX_FROM_TUNNEL} == '1'">
        Require all denied
    </If>
</LocationMatch>
