; ---------------------------------------------------------------------------
; NONXSTUDIOS — PHP overrides for the container
; ---------------------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; Match UPLOAD_MAX_BYTES in .env (8 MiB) with headroom for form overhead.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

; Sessions: cookies are hardened in application code; these are belt-and-braces.
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1

; OPcache: production tuning. validate_timestamps=0 means code changes require
; a container restart, which is correct for an immutable image.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
