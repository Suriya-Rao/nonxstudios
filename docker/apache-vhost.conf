# ---------------------------------------------------------------------------
# NONXSTUDIOS — Apache vhost for the container
#
# The document root is public/, set via APACHE_DOCUMENT_ROOT in the Dockerfile.
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defence in depth: never serve application internals even if the document
    # root is ever misconfigured.
    <Directory /var/www/nonxstudios/app>
        Require all denied
    </Directory>
    <Directory /var/www/nonxstudios/config>
        Require all denied
    </Directory>
    <Directory /var/www/nonxstudios/storage>
        Require all denied
    </Directory>
    <Directory /var/www/nonxstudios/database>
        Require all denied
    </Directory>

    # --- Keep the admin panel off the public tunnel -------------------------
    # When the site is exposed through a Cloudflare Tunnel, every proxied
    # request carries CF-Connecting-IP. Requests arriving WITH that header come
    # from the internet, so /admin is denied for them. Requests without it come
    # from the host (localhost / the Docker network), where the dashboard
    # remains reachable for administration.
    #
    # This block is included only when ADMIN_ALLOW_REMOTE is not "true"; the
    # entrypoint writes docker/admin-guard.conf into the config tree at boot.
    IncludeOptional /etc/apache2/nonx-admin-guard.conf

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
