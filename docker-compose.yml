# ---------------------------------------------------------------------------
# NONXSTUDIOS — full stack (web + database)
#
#   docker compose up -d --build        start
#   docker compose logs -f web          follow logs
#   docker compose down                 stop (keeps data)
#   docker compose down -v              stop and DELETE the database volume
#
# Credentials come from `.env` (never committed). Copy `.env.example` to `.env`
# and set at minimum APP_KEY, DB_PASS and APP_URL.
# ---------------------------------------------------------------------------
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-nonxstudios}
      MARIADB_USER: ${DB_USER:-nonx_user}
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS must be set in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS must be set in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the web service needs to reach it.
    expose:
      - "3306"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-NONXSTUDIOS}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:?APP_KEY must be set in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}

      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-nonxstudios}
      DB_USER: ${DB_USER:-nonx_user}
      DB_PASS: ${DB_PASS:?DB_PASS must be set in .env}
      DB_CHARSET: utf8mb4

      SESSION_SECURE: ${SESSION_SECURE:-false}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-7200}

      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-8388608}
      CONTACT_RATE_LIMIT: ${CONTACT_RATE_LIMIT:-3}
      CONTACT_RATE_WINDOW: ${CONTACT_RATE_WINDOW:-900}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_WINDOW: ${LOGIN_LOCKOUT_WINDOW:-900}

      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NONXSTUDIOS}
      MAIL_TO_ADDRESS: ${MAIL_TO_ADDRESS:-}

      # Set SEED_DEMO=true once to load the six demo projects.
      SEED_DEMO: ${SEED_DEMO:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Persist uploads and logs across container rebuilds.
      - uploads:/var/www/nonxstudios/storage/uploads
      - logs:/var/www/nonxstudios/storage/logs

volumes:
  db_data:
  uploads:
  logs:
