# ---------------------------------------------------------------------------
# NONXSTUDIOS — Apache virtual host (example)
#
# Install to /etc/apache2/sites-available/nonxstudios.conf (Debian/Ubuntu) or
# /etc/httpd/conf.d/nonxstudios.conf (RHEL family), then enable it.
#
# Replace example.com and the paths with your real values. Requires the
# `rewrite`, `headers` and `expires` modules. HTTPS is assumed to be
# terminated here or by a reverse proxy; adjust if your setup differs.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    # Redirect everything to HTTPS.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com

    # --- Document root MUST point at public/ -------------------------------
    # The application, config, storage and vendor directories sit OUTSIDE this
    # directory, so they are unreachable over HTTP.
    DocumentRoot /var/www/nonxstudios/public

    <Directory /var/www/nonxstudios/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- TLS ---------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example.com/privkey.pem

    # --- Security headers --------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # --- Upload ceiling (match UPLOAD_MAX_BYTES in .env) -------------------
    php_value upload_max_filesize 8M
    php_value post_max_size 10M

    ErrorLog  ${APACHE_LOG_DIR}/nonxstudios-error.log
    CustomLog ${APACHE_LOG_DIR}/nonxstudios-access.log combined
</VirtualHost>
