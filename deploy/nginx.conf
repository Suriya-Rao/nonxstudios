# ---------------------------------------------------------------------------
# NONXSTUDIOS — nginx server block (example)
#
# Install to /etc/nginx/sites-available/nonxstudios, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Replace example.com, the paths and the PHP-FPM socket with your real values.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # --- Document root MUST point at public/ -------------------------------
    root /var/www/nonxstudios/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    # Front controller: everything that is not a real file goes to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-lived caching for static assets.
    location ~* \.(css|js|jpg|jpeg|png|webp|avif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # adjust version/socket
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    # Defence in depth: block any PHP that ends up under an upload directory.
    location ~* /uploads/.*\.php$ {
        deny all;
    }

    error_log  /var/log/nginx/nonxstudios-error.log;
    access_log /var/log/nginx/nonxstudios-access.log;
}
